<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال — GovMind</title>
    <!--
      صفحة مستقلّة تمامًا: بلا خط خارجي وبلا ملف أنماط، لأنها تُعرض حين لا
      شبكة أصلًا، فأي طلب إضافي فيها سيفشل.
    -->
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f4f6f8;
        color: #14171c;
        font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
        line-height: 1.85;
      }
      .card {
        max-width: 26rem;
        width: 100%;
        padding: 2rem;
        background: #fff;
        border: 1px solid #dfe4e9;
        border-radius: 1rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.9375rem;
        color: #5b6572;
      }
      button {
        min-height: 2.875rem;
        padding-inline: 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: #1e50c8;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #16388f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>لا يوجد اتصال</h1>
      <p>
        تعذّر الوصول إلى GovMind. تأكد من اتصال جهازك بشبكة جهتك، ثم أعد
        المحاولة.
      </p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
